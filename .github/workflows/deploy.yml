name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check & unit tests
        run: |
          npm run typecheck
          npm test

      # Firebase 웹 클라이언트 설정(공개값)은 저장소의 .env.production 에서 읽습니다.
      # 관리자 이메일만 GitHub Secret(VITE_ADMIN_EMAIL)으로 주입합니다. 없으면 로그인 화면에 이메일 칸이 표시됩니다.
      # ⚠️ 비밀번호·서비스 계정 키 같은 진짜 비밀값은 절대 빌드에 주입하지 마세요 (빌드된 JS는 공개됩니다).
      - name: Build
        env:
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
        run: npx vite build

      - name: Verify build output
        run: |
          test -f dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then echo "::error::dist/index.html 이 빌드되지 않은 원본입니다"; exit 1; fi
          grep -q 'berich-7cdb2' dist/assets/*.js || { echo "::error::Firebase 설정이 빌드에 포함되지 않았습니다"; exit 1; }
          echo "index.html asset references:"; grep -oE '(src|href)="[^"]*"' dist/index.html

      - name: Guard against leaked server secrets
        run: |
          if grep -rEl "BEGIN (RSA )?PRIVATE KEY|\"private_key\"|client_secret" dist; then
            echo "::error::빌드 결과물에 비밀키로 보이는 문자열이 있습니다. 배포를 중단합니다."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
