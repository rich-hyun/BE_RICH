name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check & unit tests
        run: |
          npm run typecheck
          npm test

      # Firebase "웹 클라이언트 설정"만 주입합니다. (브라우저에 공개되는 값)
      # ⚠️ 비밀번호·서비스 계정 키 같은 진짜 비밀값은 절대 여기에 추가하지 마세요.
      #    VITE_ 값은 빌드된 JavaScript에 그대로 포함되어 누구나 볼 수 있습니다.
      - name: Check required settings
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
        run: |
          missing=0
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_ADMIN_UID; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secret '$v' 가 설정되지 않았습니다 (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_ADMIN_UID: ${{ secrets.VITE_ADMIN_UID }}
        run: npx vite build

      - name: Guard against leaked server secrets
        run: |
          if grep -rEl "BEGIN (RSA )?PRIVATE KEY|\"private_key\"|client_secret" dist; then
            echo "::error::빌드 결과물에 비밀키로 보이는 문자열이 있습니다. 배포를 중단합니다."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
